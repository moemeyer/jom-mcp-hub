name: Justice Nexus CI

on:
  push:
    paths:
      - 'justice-nexus/**'
      - 'mcp-catalog.json'
      - 'oauth/**'
      - '.github/workflows/justice-nexus-ci.yml'
  pull_request:
    paths:
      - 'justice-nexus/**'
      - 'mcp-catalog.json'
      - 'oauth/**'
      - '.github/workflows/justice-nexus-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r justice-nexus/requirements.txt

      - name: Pytest
        env:
          MCP_API_KEY: ci-justice-nexus-test-token
        run: pytest justice-nexus/tests -q